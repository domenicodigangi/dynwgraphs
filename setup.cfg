[bumpversion]
current_version = 0.1.0
commit = True
tag = True

[bumpversion:file:setup.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:dynwgraphs/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'

[bdist_wheel]
universal = 1

[flake8]
max-line-length = 127
max-complexity = 15
exclude =
    docs,
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .tox,
    .venv,
    venv,
    adahessian,
    tobit
ignore = E203, E266, E501, W503, F403, F401
per-file-ignores =
    __init__.py:F401

[tool:pytest]
collect_ignore = ['setup.py']
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=dynwgraphs
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

[coverage:run]
source = dynwgraphs
omit =
    */tests/*
    */dev_utils/*
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 127
skip = adahessian,tobit,.tox,.venv,venv,build,dist

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = (adahessian|tobit|build|dist|\.eggs)
